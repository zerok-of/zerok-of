<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zerok | Links</title>
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #020005;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      perspective: 1000px;
    }

    /* Fondo animado tipo agua / esferas flotantes neón dinámicas */
    .neon-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at center, #120124 0%, #030007 70%, #000000 100%);
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.7;
      animation: floatWater 14s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 400px;
      height: 400px;
      background: #c084fc;
      top: 5%;
      left: -100px;
    }

    .blob-2 {
      width: 450px;
      height: 450px;
      background: #f87171;
      bottom: 5%;
      right: -120px;
      animation-delay: -4s;
    }

    .blob-3 {
      width: 350px;
      height: 350px;
      background: #9333ea;
      bottom: -30px;
      left: 15%;
      animation-delay: -8s;
    }

    .blob-4 {
      width: 320px;
      height: 320px;
      background: #dc2626;
      top: -30px;
      right: 20%;
      animation-delay: -11s;
    }

    @keyframes floatWater {
      0% {
        transform: translate(0px, 0px) scale(1) rotate(0deg);
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      }
      50% {
        transform: translate(40px, -40px) scale(1.15) rotate(180deg);
        border-radius: 60% 40% 30% 70% / 50% 30% 70% 50%;
      }
      100% {
        transform: translate(-30px, 30px) scale(0.95) rotate(360deg);
        border-radius: 50% 50% 50% 50% / 60% 40% 60% 40%;
      }
    }

    /* Tarjeta principal con borde brillante giratorio */
    .card-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 420px;
      z-index: 1;
    }

    .card {
      background: rgba(12, 3, 22, 0.8);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 2px solid transparent;
      background-clip: padding-box;
      border-radius: 24px;
      padding: 35px 25px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.35), 
                  0 0 20px rgba(239, 68, 68, 0.3),
                  inset 0 0 25px rgba(168, 85, 247, 0.15);
      position: relative;
      transition: transform 0.1s ease-out, box-shadow 0.3s ease;
      transform-style: preserve-3d;
    }

    /* Borde brillante exterior animado */
    .card::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, #a855f7, #ef4444, #3b82f6, #a855f7);
      background-size: 400%;
      z-index: -1;
      border-radius: 26px;
      animation: borderGlow 8s linear infinite;
      opacity: 0.7;
    }

    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Contenedor del avatar con Badge de LIVE animado */
    .avatar-container {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #c084fc;
      box-shadow: 0 0 30px #a855f7, 0 0 50px #ef4444;
      display: block;
      transition: transform 0.3s ease;
    }

    .avatar-container:hover .avatar {
      transform: scale(1.08) rotate(3deg);
    }

    .live-badge {
      position: absolute;
      bottom: 5px;
      right: 10px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 5px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 15px #ef4444;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: #fff;
      border-radius: 50%;
      animation: pulseDot 0.8s infinite alternate;
    }

    @keyframes pulseDot {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    h1 {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 8px;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(168, 85, 247, 0.9), 0 0 25px rgba(239, 68, 68, 0.6);
      letter-spacing: 2px;
    }

    .bio {
      font-size: 14px;
      color: #e2e8f0;
      margin-bottom: 25px;
      line-height: 1.5;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
    }

    /* Reproductor de Música Neón con Ecualizador */
    .music-player {
      background: rgba(0, 0, 0, 0.75);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      border: 1px solid rgba(168, 85, 247, 0.5);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.25);
    }

    .song-details {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 20px;
    }

    .bar {
      width: 3px;
      height: 4px;
      background: #f87171;
      border-radius: 2px;
      transition: height 0.2s ease;
    }

    .playing .bar {
      animation: bounce 0.8s ease-in-out infinite alternate;
    }

    .playing .bar:nth-child(1) { animation-delay: 0.1s; background: #c084fc; }
    .playing .bar:nth-child(2) { animation-delay: 0.3s; background: #f87171; }
    .playing .bar:nth-child(3) { animation-delay: 0.2s; background: #c084fc; }
    .playing .bar:nth-child(4) { animation-delay: 0.4s; background: #f87171; }

    @keyframes bounce {
      0% { height: 4px; }
      100% { height: 20px; }
    }

    .song-info {
      text-align: left;
      font-size: 13px;
    }

    .song-title {
      font-weight: bold;
      color: #f3e8ff;
      text-shadow: 0 0 6px rgba(168, 85, 247, 0.6);
    }

    .song-artist {
      color: #f87171;
      font-size: 11px;
      font-weight: 700;
    }

    .play-btn {
      background: linear-gradient(135deg, #c084fc, #ef4444);
      border: none;
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.7);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.15);
      box-shadow: 0 0 25px #ef4444, 0 0 15px #c084fc;
    }

    /* Botones de enlaces con efectos vibrantes */
    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(20, 5, 35, 0.9);
      color: #fff;
      text-decoration: none;
      padding: 15px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 16px;
      border: 1px solid rgba(168, 85, 247, 0.4);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: 0.6s;
    }

    .link-btn:hover::before {
      left: 100%;
    }

    .link-btn:hover {
      background: rgba(168, 85, 247, 0.25);
      border-color: #f87171;
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.6), 0 0 15px rgba(168, 85, 247, 0.6);
      color: #fff;
    }

    .link-btn i {
      font-size: 22px;
    }
  </style>
</head>
<body>

  <!-- Esferas de luz neón flotantes -->
  <div class="neon-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="card-wrapper" id="cardWrapper">
    <div class="card" id="card">
      
      <!-- Avatar con insignia LIVE -->
      <div class="avatar-container">
        <img src="avatar.png" alt="Avatar Zerok" class="avatar">
        <div class="live-badge">
          <span class="live-dot"></span> Kick Live
        </div>
      </div>
      
      <h1>ZEROK</h1>
      <p class="bio">Down que quiere ser famoso | En vivo casi nunca pero doy show cuando prendo</p>

      <!-- Reproductor de audio con ecualizador -->
      <div class="music-player">
        <div class="song-details">
          <div class="equalizer" id="equalizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
          <div class="song-info">
            <div class="song-title">Fluorescent Adolescent</div>
            <div class="song-artist">Arctic Monkeys</div>
          </div>
        </div>
        <button class="play-btn" id="musicBtn" onclick="toggleMusic()">
          <i class="fa-solid fa-play" id="musicIcon"></i>
        </button>
      </div>

      <!-- Etiqueta de audio oculta -->
      <audio id="bgMusic" loop>
        <source src="musica.mp3" type="audio/mpeg">
      </audio>

      <!-- Enlaces a redes -->
      <div class="links">
        <a href="https://kick.com/new-zerok-of" target="_blank" class="link-btn">
          <i class="fa-solid fa-bolt" style="color: #53FC18;"></i> Kick
        </a>
        <a href="https://www.youtube.com/@zerok.of." target="_blank" class="link-btn">
          <i class="fa-brands fa-youtube" style="color: #FF0000;"></i> YouTube
        </a>
        <a href="https://discord.gg/DjeBza6ne" target="_blank" class="link-btn">
          <i class="fa-brands fa-discord" style="color: #5865F2;"></i> Servidor de Discord
        </a>
        <a href="https://www.instagram.com/zerok.of/?hl=es" target="_blank" class="link-btn">
          <i class="fa-brands fa-instagram" style="color: #E1306C;"></i> Instagram
        </a>
      </div>
    </div>
  </div>

  <script>
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    const musicIcon = document.getElementById('musicIcon');
    const equalizer = document.getElementById('equalizer');

    // Control de música y animación del ecualizador
    function toggleMusic() {
      if (music.paused) {
        music.play();
        musicIcon.classList.remove('fa-play');
        musicIcon.classList.add('fa-pause');
        equalizer.classList.add('playing');
      } else {
        music.pause();
        musicIcon.classList.remove('fa-pause');
        musicIcon.classList.add('fa-play');
        equalizer.classList.remove('playing');
      }
    }

    // Efecto 3D / Inclinación de la tarjeta con el movimiento del ratón
    const card = document.getElementById('card');
    const wrapper = document.getElementById('cardWrapper');

    wrapper.addEventListener('mousemove', (e) => {
      const rect = wrapper.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;

      const rotateX = (-y / rect.height) * 15;
      const rotateY = (x / rect.width) * 15;

      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    wrapper.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });
  </script>

</body>
</html>
